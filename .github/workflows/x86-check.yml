# Checks for submissions/asm-epoll-nickita-khylkouski on a real x86-64 kernel (not part of the submission).
name: x86 check
on:
  push:
    branches: [x86-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: machine
        run: |
          uname -a; nproc; grep -m1 "model name" /proc/cpuinfo
          echo "-- receive queues"; ls -d /sys/class/net/*/queues/rx-* ; cat /sys/class/net/*/queues/rx-*/rps_cpus
          echo "-- /proc/interrupts"; cat /proc/interrupts
          echo "-- /proc/softirqs"; grep -E "CPU|NET_RX|NET_TX" /proc/softirqs
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq curl openssl tcpdump gdb
      - name: postgres max_connections = 600
        run: |
          psql -qX -d postgres -c "ALTER SYSTEM SET max_connections = 600"
          # logs for the load runs: statements over 50 ms, lock waits over 100 ms, every autovacuum
          psql -qX -d postgres -c "ALTER SYSTEM SET log_min_duration_statement = '50ms'" \
            -c "ALTER SYSTEM SET log_lock_waits = on" -c "ALTER SYSTEM SET deadlock_timeout = '100ms'" \
            -c "ALTER SYSTEM SET log_autovacuum_min_duration = 0"
          docker restart "$(docker ps -q --filter ancestor=postgres:18)"
          until pg_isready -q; do sleep 1; done
      - name: seed
        run: bash seed/make-seed.sh
      - name: install.sh
        run: sudo bash submissions/asm-epoll-nickita-khylkouski/install.sh && as --version | head -1
      - name: test/run.sh (runs build.sh first)
        run: bash test/run.sh submissions/asm-epoll-nickita-khylkouski
      - name: build the PR's first commit (control for the retransmission and 10x load runs)
        if: always()
        run: |
          git fetch -q --depth 1 origin 74a3ba1e8b912f9c3632861bea11d3434529efd2
          mkdir -p /tmp/pr61 && git archive FETCH_HEAD submissions/asm-epoll-nickita-khylkouski | tar -x -C /tmp/pr61
          (cd /tmp/pr61/submissions/asm-epoll-nickita-khylkouski && bash build.sh)
      - name: build the previous follow-up, reads and writes on shared connections (control for the 10x runs)
        if: always()
        run: |
          git fetch -q --depth 1 origin e0ea2483500f3e38acb77df3f390ffd58ff36c50
          mkdir -p /tmp/shared && git archive FETCH_HEAD submissions/asm-epoll-nickita-khylkouski | tar -x -C /tmp/shared
          (cd /tmp/shared/submissions/asm-epoll-nickita-khylkouski && bash build.sh)
      - name: build the c-epoll entry (a reference server for the 10x load runs)
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq bison flex nasm
          bash submissions/c-epoll-unorig-username/build.sh
      - name: cpu steering
        if: always()
        run: bash ci/steer.sh
      - name: start-up loop (detector edge cases)
        if: always() && !contains(github.event.head_commit.message, '[diag]')
        run: bash ci/startloop.sh
      - name: delayed ACKs
        if: always()
        run: bash ci/ack.sh
      - name: thin linear timeouts on the server's sockets
        if: always()
        run: bash ci/thin.sh
      - name: retransmission timing of responses (iptables drops on lo), this build and the control
        if: always()
        run: bash ci/rto.sh
      - uses: actions/setup-go@v5
        if: always()
        with: { go-version-file: bench/mload/go.mod, cache: false }
      - name: mload smoke run
        if: always()
        run: bash ci/load.sh
      - name: mload, 10x the request rate (informational)
        if: always()
        continue-on-error: true
        run: THINK=0.25 bash ci/load.sh
      - name: mload, 10x the request rate, the PR's first commit (control)
        if: always() && !contains(github.event.head_commit.message, '[diag]')
        continue-on-error: true
        run: SUB=/tmp/pr61/submissions/asm-epoll-nickita-khylkouski THINK=0.25 bash ci/load.sh
      - name: mload, 10x the request rate, shared connections (control)
        if: always()
        continue-on-error: true
        run: SUB=/tmp/shared/submissions/asm-epoll-nickita-khylkouski THINK=0.25 bash ci/load.sh
      - name: mload, 10x the request rate, the c-epoll entry (reference)
        if: always()
        continue-on-error: true
        run: SUB=$PWD/submissions/c-epoll-unorig-username BIN=bin/server THINK=0.25 bash ci/load.sh
      - name: mload, 10x the request rate, this build again (order check)
        if: always()
        continue-on-error: true
        run: THINK=0.25 bash ci/load.sh
